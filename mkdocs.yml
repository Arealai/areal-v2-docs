site_name: "Areal V2 Documentation"

theme:
  name: "material"
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

  logo: assets/logo.png
  # favicon: assets/favicon.png

plugins:
  - search
  - mermaid2

nav:
  - Home: [index.md, api.md, support.md]
  - Accounts: accounts/index.md
  - Processing:
      [
        processing/index.md,
        processing/status.md,
        processing/classification.md,
        processing/extraction.md,
      ]
  - Gateways: gateways/index.md
  - CDBalancer: cdbalancer/index.md
  - Copilot: copilot/index.md
